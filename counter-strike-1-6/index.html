<script crossorigin="anonymous" src="https://cdn.jsdelivr.net/gh/playsurd/surd-runtime@main/va429808db7/runtime.js"></script>

    <title>Counter-Strike 1.6</title>
    <style>
        canvas {
            width: 100vw;
            height: 100vh;
            top: 0;
            left: 0;
            position: fixed;
        }

        body {
            margin: 0;
            background: #231F20;
        }

        #loading-screen {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background: #231F20;
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 9999;
        }

        #progress-container {
            width: 300px;
            height: 16px;
            border: 1px solid #ffffff;
            background: transparent;
            box-sizing: border-box;
        }

        #progress-bar {
            width: 0%;
            height: 100%;
            background: #ffffff;
            transition: width 0.1s ease-out;
        }
    </style>
    <script crossorigin="anonymous" src="engine/raw.js"></script>
    <script crossorigin="anonymous" src="vendor/jszip.min.js"></script>
</head>
<body>

<div id="loading-screen">
    <div id="progress-container">
        <div id="progress-bar"></div>
    </div>
</div>

<canvas id="canvas"></canvas>

<script type="module">
    const JSZip = window.JSZip;

    function updateProgress(percent) {
        const bar = document.getElementById('progress-bar');
        if (bar) {
            bar.style.width = `${Math.min(100, Math.max(0, percent))}%`;
        }
    }

    const VALVE_PARTS_BASE_URL = new URL('./valve-parts/', document.baseURI).href;
    const MAX_CONCURRENT_PART_DOWNLOADS = 3;

    async function sha256Hex(bytes) {
        if (!globalThis.crypto?.subtle) return null;
        const digest = await globalThis.crypto.subtle.digest('SHA-256', bytes);
        return Array.from(new Uint8Array(digest), byte => byte.toString(16).padStart(2, '0')).join('');
    }

    function showLoadingError(error) {
        console.error('Falha ao carregar Counter-Strike 1.6:', error);
        const screen = document.getElementById('loading-screen');
        if (!screen) return;

        screen.innerHTML = '';
        const message = document.createElement('div');
        message.style.color = '#ffffff';
        message.style.fontFamily = 'Arial, sans-serif';
        message.style.textAlign = 'center';
        message.style.padding = '24px';
        message.textContent = `Não foi possível carregar o jogo: ${error?.message || error}`;
        screen.appendChild(message);
    }

    async function loadValveArchiveFromGitHub() {
        const manifestRes = await fetch(`${VALVE_PARTS_BASE_URL}manifest.json`, { cache: 'no-cache' });
        if (!manifestRes.ok) {
            throw new Error(`Não foi possível carregar o manifesto do valve.zip (${manifestRes.status})`);
        }

        const manifest = await manifestRes.json();
        if (!manifest.archiveSize || !manifest.partSize || !manifest.parts?.length) {
            throw new Error('Manifesto do valve.zip inválido');
        }

        const manifestSize = manifest.parts.reduce((sum, part) => sum + part.size, 0);
        if (manifestSize !== manifest.archiveSize) {
            throw new Error('O tamanho das partes não corresponde ao manifesto');
        }

        const partBlobs = new Array(manifest.parts.length);
        let nextPart = 0;
        let downloadedBytes = 0;

        async function downloadWorker() {
            while (true) {
                const partIndex = nextPart++;
                if (partIndex >= manifest.parts.length) return;

                const part = manifest.parts[partIndex];
                let blob = null;
                for (let attempt = 0; attempt < 3 && !blob; attempt++) {
                const partRes = await fetch(`${VALVE_PARTS_BASE_URL}${encodeURIComponent(part.file)}`, attempt ? { cache: 'reload' } : undefined);
                if (!partRes.ok) {
                    throw new Error(`Falha ao carregar ${part.file} (${partRes.status})`);
                }
                const chunks = [];
                let receivedBytes = 0;
                const ab = new Uint8Array(await partRes.arrayBuffer());
                chunks.push(ab);
                receivedBytes = ab.byteLength;
                if (receivedBytes !== part.size) {
                    if (attempt < 2) continue;
                    throw new Error(`Tamanho inesperado em ${part.file}`);
                }
                const candidate = new Blob(chunks, { type: 'application/octet-stream' });
                if (part.sha256) {
                    const partHash = await sha256Hex(await candidate.arrayBuffer());
                    if (partHash && partHash !== part.sha256) {
                        if (attempt < 2) continue;
                        throw new Error(`A verificação SHA-256 falhou em ${part.file}`);
                    }
                }
                blob = candidate;
                downloadedBytes += receivedBytes;
                updateProgress(5 + (downloadedBytes / manifest.archiveSize) * 45);
                }
                partBlobs[partIndex] = blob;
            }
        }

        await Promise.all(
            Array.from(
                { length: Math.min(MAX_CONCURRENT_PART_DOWNLOADS, manifest.parts.length) },
                downloadWorker,
            ),
        );
        updateProgress(55);

        return new Blob(partBlobs, { type: 'application/zip' });
    }

    async function main() {
        updateProgress(5);
        const archiveBlob = await loadValveArchiveFromGitHub();
        updateProgress(55);

        const zip = await JSZip.loadAsync(archiveBlob);
        updateProgress(65);

        const fileKeys = Object.keys(zip.files).filter(p => !zip.files[p].dir);
        const extrasRes = await fetch('engine/extras.pk3');
        if (!extrasRes.ok) {
            throw new Error(`Não foi possível carregar extras.pk3 (${extrasRes.status})`);
        }
        const extras = await extrasRes.arrayBuffer();
        updateProgress(70);

        Xash3D({
            arguments: ['-windowed', '-game', 'cstrike', '+_vgui_menus', '0', '-ref', 'webgl2'],
            canvas: document.getElementById('canvas'),
            dynamicLibraries: [
                "filesystem_stdio.wasm",
                "libref_webgl2.wasm",
                "cl_dlls/menu_emscripten_wasm32.wasm",
                "dlls/cs_emscripten_wasm32.wasm",
                "cl_dlls/client_emscripten_wasm32.wasm",
                "/rodir/filesystem_stdio.wasm",
            ],
            preRun: [function (xash) {
                xash.addRunDependency('surd-cstrike');
                void (async () => {
                    try {
                        updateProgress(72);
                        for (let index = 0; index < fileKeys.length; index++) {
                            const p = fileKeys[index];
                            const path = `/rodir/${p}`;
                            const bytes = await zip.files[p].async('uint8array');
                            const dir = path.split('/').slice(0, -1).join('/');
                            xash.FS.mkdirTree(dir);
                            xash.FS.writeFile(path, bytes);
                            updateProgress(70 + ((index + 1) / fileKeys.length) * 25);
                            await new Promise(resolve => setTimeout(resolve, 0));
                        }

                        xash.FS.writeFile('/rodir/cstrike/extras.pk3', new Uint8Array(extras));
                        xash.FS.mkdir('/rwdir');
                        xash.FS.chdir('/rodir');
                        updateProgress(100);
                        setTimeout(() => {
                            const loadingScreen = document.getElementById('loading-screen');
                            if (loadingScreen) loadingScreen.remove();
                        }, 300);
                        xash.removeRunDependency('surd-cstrike');
                    } catch (error) {
                        showLoadingError(error);
                    }
                })();
            }],
            locateFile: (p) => {
                switch (p) {
                    case 'xash.wasm':
                        return 'engine/xash.wasm'
                    case '/rodir/filesystem_stdio.wasm':
                    case 'filesystem_stdio.wasm':
                        return 'engine/filesystem_stdio.wasm'
                    case 'libref_webgl2.wasm':
                        return 'engine/libref_webgl2.wasm'
                    case 'cl_dlls/menu_emscripten_wasm32.wasm':
                        return 'engine/cl_dlls/menu_emscripten_wasm32.wasm'
                    case 'dlls/cs_emscripten_wasm32.wasm':
                        return 'engine/dlls/cs_emscripten_wasm32.wasm'
                    case 'cl_dlls/client_emscripten_wasm32.wasm':
                        return 'engine/cl_dlls/client_emscripten_wasm32.wasm'
                    default:
                        return p
                }
            },
        })
    }

    main().catch(showLoadingError);
</script>
</body>
